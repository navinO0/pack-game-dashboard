services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: packscore-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/pack_score_calc.db
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env before running in production}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-7}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - packscore_sqlite_data:/app/data

volumes:
  packscore_sqlite_data:
